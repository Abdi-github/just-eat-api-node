# ============================================================
# Just Eat Clone API — Production Docker Compose
# ============================================================
# Usage:
#   docker compose -f docker-compose.prod.yml up --build -d
#   docker compose -f docker-compose.prod.yml down
# ============================================================

services:
  # ── API Server (Production Build) ──
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: justeat_api_prod
    restart: always
    ports:
      - '${API_PORT:-4011}:4005'
    env_file:
      - .env.production
    environment:
      - NODE_ENV=production
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - justeat_network
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.justeat-api.rule=Host(`justeat-api.swiftapp.ch`)"
      - "traefik.http.routers.justeat-api.entrypoints=websecure"
      - "traefik.http.routers.justeat-api.tls.certresolver=letsencrypt"
      - "traefik.http.services.justeat-api.loadbalancer.server.port=4005"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
        reservations:
          memory: 256M
          cpus: '0.25'

  # ── MongoDB ──
  mongodb:
    image: mongo:7.0
    container_name: justeat_mongodb_prod
    restart: always
    ports:
      - '${MONGO_PORT:-27022}:27017'
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    environment:
      - MONGO_INITDB_DATABASE=${MONGO_DB:-justeat_dev}
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_ROOT_USER:-root}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD:-password}
    networks:
      - justeat_network
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'

  # ── Redis ──
  redis:
    image: redis:7-alpine
    container_name: justeat_redis_prod
    restart: always
    ports:
      - '${REDIS_PORT:-6383}:6379'
    volumes:
      - redis_data:/data
    command: >
      redis-server
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --requirepass ${REDIS_PASSWORD:-}
    networks:
      - justeat_network
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'

networks:
  justeat_network:
    driver: bridge
    name: justeat_network_prod
  traefik:
    external: true

volumes:
  mongodb_data:
    name: justeat_mongodb_data_prod
  mongodb_config:
    name: justeat_mongodb_config_prod
  redis_data:
    name: justeat_redis_data_prod
